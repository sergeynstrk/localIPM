function exportPNG(){const p=currentProject();if(!p)return;const tmp=document.createElement('canvas');const rows=displayRows(p);renderGantt(tmp,{rows,scrollTop:0,viewportHeight:HEADER_H+rows.length*ROW_H+20,dpr:2});tmp.toBlob(b=>{downloadBlob(b,`${p.name}-gantt.png`);state.notice='PNG сохранён.';render()},'image/png')}
function showPrint(){const p=currentProject();if(!p)return;const rows=flattenAll(p);const tmp=document.createElement('canvas');const rws=displayRows(p);renderGantt(tmp,{rows:rws,scrollTop:0,viewportHeight:HEADER_H+rws.length*ROW_H+20,dpr:2});const url=tmp.toDataURL('image/png');
el('print-area').innerHTML=`<h1>${esc(p.name)}</h1><div>Автор: ${esc(p.author||'—')} · Период: ${fmtDate(p.start_date)} — ${fmtDate(p.finish_date)} · Выполнение: ${p.percent_complete||0}% · Подготовлено в LocalPM · ${new Date().toLocaleString('ru-RU')}</div><h2>Сводка</h2><table><tr><th>Задач</th><th>Вех</th><th>Связей</th><th>Критических</th></tr><tr><td>${p.tasks.length}</td><td>${rows.filter(t=>t.is_milestone).length}</td><td>${p.dependencies.length}</td><td>${rows.filter(t=>t.critical).length}</td></tr></table><h2 class="pgbrk">План</h2><table><tr><th>№</th><th>Задача</th><th>Длит.</th><th>Начало</th><th>Окончание</th><th>Отв.</th><th>%</th></tr>${rows.map(t=>`<tr><td>${esc(t.external_number)}</td><td style="padding-left:${8+t.level*12}px">${t.is_milestone?'◆ ':''}${esc(t.name)}</td><td>${t.is_milestone?0:t.duration_days}</td><td>${fmtDate(t.start_date)}</td><td>${fmtDate(t.finish_date)}</td><td>${esc(t.owner||'')}</td><td>${t.percent_complete||0}</td></tr>`).join('')}</table><h2 class="pgbrk">Вехи</h2><table><tr><th>№</th><th>Веха</th><th>Дата</th></tr>${rows.filter(t=>t.is_milestone).map(t=>`<tr><td>${esc(t.external_number)}</td><td>${esc(t.name)}</td><td>${fmtDate(t.finish_date)}</td></tr>`).join('')}</table><h2 class="pgbrk">Диаграмма Ганта</h2><img src="${url}" alt="Гант"><div class="muted">Легенда: синий — задача, красный — критический путь, ромб — веха, скобка — суммарная, серая линия — базовый план.</div>`;
setTimeout(()=>window.print(),200)}
/* ---- передача ---- */
async function transferOut(id){const p=state.projects.find(x=>x.id===id)||currentProject();if(!p)return;const probs=validatePlan(p);const hard=probs.filter(x=>x.text.includes('Цикл'));
if(hard.length&&!confirm('Критические проблемы плана:\n'+truncateList(hard.map(x=>x.text),10)+'\nПередать всё равно?'))return;
if(probs.length&&!hard.length&&!confirm('Предупреждения плана:\n'+truncateList(probs.map(x=>x.text),10)+'\nПередать?'))return;
showModal('Передача проекта',`<div class="form-grid"><div class="form-field"><label>Ваше имя</label><input id="tr-sender" type="text" value="${esc(state.userName)}"></div><div class="form-field"><label>Кому передаётся</label><input id="tr-rcpt" type="text"></div><div class="form-field full"><label>Комментарий (до 1000 симв.)</label><textarea id="tr-comment" maxlength="1000"></textarea></div><div class="form-field full"><label class="checkbox"><input id="tr-return" type="checkbox"> Пакет возврата изменений автору</label><label class="checkbox"><input id="tr-clean" type="checkbox"> «Чистый» режим: без истории и журнала</label></div></div>`,`<button class="btn" onclick="App.closeModal()">Отмена</button><button class="btn primary" onclick="App.transferBuild('${p.id}')">Сформировать файл</button>`)}
async function transferBuild(id){const p=state.projects.find(x=>x.id===id);if(!p)return;const sender=el('tr-sender').value.trim();if(sender){state.userName=sender;localStorage.setItem('localpm_user',sender)}
const kind=el('tr-return').checked?'return':'transfer';const clean=el('tr-clean').checked;
const proj={projectId:p.id,name:p.name,revision:p.revision||1,baseRevision:p.baseRevision||p.revision||1,changedAt:new Date().toISOString(),author:sender||p.author||'',description:p.description||'',start_date:p.start_date,status_date:p.status_date,view_settings:p.view_settings,custom_fields:p.custom_fields,calendar:{calendar_id:p.calendar_id,working_days:p.working_days,exceptions:p.exceptions},tasks:p.tasks,dependencies:p.dependencies};
const meta={format:'localpm-project-package',formatVersion:1,kind,packageId:uid(),createdAt:new Date().toISOString(),sender:{name:sender},recipient:{name:el('tr-rcpt').value.trim()},comment:el('tr-comment').value.trim(),includeHistory:!clean,project:proj,cipher:null};
meta.checksum=await sha256(JSON.stringify(proj)+JSON.stringify(meta.sender)+JSON.stringify(meta.recipient)+meta.comment+kind);
const fname=`${p.name.replace(/[^\wа-яА-ЯёЁ .-]/g,'')}_${todayISO()}.lpmproject`;
downloadBlob(new Blob([JSON.stringify(meta,null,2)],{type:'application/json'}),fname);
p.transferLog=p.transferLog||[];p.transferLog.push({direction:kind==='return'?'return':'out',counterparty:meta.recipient.name||'—',comment:meta.comment,revision:p.revision||1,package_name:fname,ts:meta.createdAt});
p.revision=(p.revision||1)+1;await dbPutProject(p);closeModal();state.notice='Пакет передачи сформирован.';render()}
function showTransferIn(){const inp=document.createElement('input');inp.type='file';inp.accept='.lpmproject,.json';inp.onchange=()=>{const f=inp.files[0];if(!f)return;const r=new FileReader();r.onload=async()=>{try{const d=JSON.parse(r.result);if(d.format!=='localpm-project-package')throw new Error('это не пакет передачи');const calc=await sha256(JSON.stringify(d.project)+JSON.stringify(d.sender)+JSON.stringify(d.recipient)+d.comment+d.kind);if(calc!==d.checksum){alert('Контрольная сумма не совпадает — импорт отклонён.');return}window.__pkgData=d;showTransferPreview(d)}catch(e){alert('Ошибка пакета: '+e.message)}};r.readAsText(f)};inp.click()}
function showTransferPreview(d){const pr=d.project;const miles=(pr.tasks||[]).filter(t=>t.is_milestone).length;const existing=state.projects.find(p=>p.id===pr.projectId);
const revWarn=(d.kind==='return'&&existing&&(existing.revision||1)>(pr.baseRevision||pr.revision||1))?`<div class="notice" style="color:var(--warning)">Внимание: проект-источник изменялся после передачи (текущая рев. ${existing.revision||1}, базовая в пакете ${pr.baseRevision||'—'}, изменён ${new Date(existing.updatedAt||Date.now()).toLocaleString('ru-RU')}).</div>`:'';
showModal(d.kind==='return'?'Возврат изменений':'Импорт проекта от коллеги',`<div class="form-field full"><div>Проект: <b>${esc(pr.name)}</b> (рев. ${pr.revision})</div><div>Отправитель: <b>${esc(d.sender&&d.sender.name||'—')}</b> · Получатель: <b>${esc(d.recipient&&d.recipient.name||'—')}</b></div><div>Дата пакета: <b>${new Date(d.createdAt).toLocaleString('ru-RU')}</b></div><div>Задач: <b>${(pr.tasks||[]).length}</b>, вех: <b>${miles}</b>, связей: <b>${(pr.dependencies||[]).length}</b></div><div>Комментарий: ${esc(d.comment||'—')}</div>${existing?`<div class="notice" style="color:var(--warning)">Проект с таким ID уже есть (рев. ${existing.revision||1}).</div>`:''}${revWarn}${d.kind==='return'?renderReturnDiff(d,existing):''}</div>`,d.kind==='return'&&existing?`<button class="btn" onclick="App.returnReject()">Отклонить</button><button class="btn primary" onclick="App.returnAccept()">Принять</button>`:`<button class="btn" onclick="App.closeModal()">Отмена</button><button class="btn primary" onclick="App.transferImport(${existing?'true':'false'})">${existing?'Заменить (с бэкапом)':'Импортировать копией'}</button>`)}
function renderReturnDiff(d,existing){if(!existing)return '<div class="muted">Проект-источник не найден: будет импортирован как копия с отметкой возврата.</div>';const local=new Map(existing.tasks.map(t=>[t.id,t]));const pkg=new Map(d.project.tasks.map(t=>[t.id,t]));let add=0,del=0,chg=0;const lines=[];d.project.tasks.forEach(t=>{const l=local.get(t.id);if(!l){add++;lines.push(`<div class="diff-add">+ №${t.external_number} ${esc(t.name)}</div>`)}else if(JSON.stringify([l.name,l.duration_days,l.start_date,l.finish_date,l.percent_complete,l.owner,l.note])!==JSON.stringify([t.name,t.duration_days,t.start_date,t.finish_date,t.percent_complete,t.owner,t.note])){chg++;lines.push(`<div class="diff-chg">~ №${t.external_number} ${esc(t.name)}</div>`)}});local.forEach((l,id)=>{if(!pkg.has(id)){del++;lines.push(`<div class="diff-del">− №${l.external_number} ${esc(l.name)}</div>`)}});return `<div class="form-field full"><label>Сравнение: добавлено ${add}, изменено ${chg}, удалено ${del}</label>${lines.slice(0,60).join('')}</div>`}
async function transferImport(replace){const d=window.__pkgData;if(!d)return;pushHistory();const pr=d.project;
if(replace){const old=state.projects.find(p=>p.id===pr.projectId);if(old){createBackup();old.tasks=JSON.parse(JSON.stringify(pr.tasks));old.dependencies=JSON.parse(JSON.stringify(pr.dependencies));old.name=pr.name;old.revision=pr.revision;repairProject(old);calculateProject(old);await dbPutProject(old)}}
else{const np=createProjectObject(pr.name,pr.start_date||todayISO(),pr.description||'');np.tasks=JSON.parse(JSON.stringify(pr.tasks));np.dependencies=JSON.parse(JSON.stringify(pr.dependencies));if(pr.calendar){np.calendar_id=pr.calendar.calendar_id||'rf';np.working_days=pr.calendar.working_days||[1,2,3,4,5];np.exceptions=pr.calendar.exceptions||[]}np.view_settings=pr.view_settings||np.view_settings;np.custom_fields=pr.custom_fields||[];np.status_date=pr.status_date||todayISO();np.author=pr.author||'';np.origin_id=pr.projectId;np.revision=pr.revision;np.baseRevision=pr.baseRevision||pr.revision;np.transferred_from=(d.sender&&d.sender.name)||'—';np.transferred_at=d.createdAt;np.name=state.projects.some(p=>p.id===pr.projectId)?`${pr.name} (передан от ${np.transferred_from})`:pr.name;np.transferLog=[{direction:'in',counterparty:np.transferred_from,comment:d.comment||'',revision:pr.revision,package_name:'',ts:d.createdAt}];state.projects.unshift(np);repairProject(np);calculateProject(np);await dbPutProject(np)}
window.__pkgData=null;closeModal();updateDbChip();state.notice='Пакет импортирован.';render()}
async function returnAccept(){const d=window.__pkgData;if(!d)return;const old=state.projects.find(p=>p.id===d.project.projectId);if(!old)return;pushHistory();createBackup();old.tasks=JSON.parse(JSON.stringify(d.project.tasks));old.dependencies=JSON.parse(JSON.stringify(d.project.dependencies));if(d.project.calendar){old.calendar_id=d.project.calendar.calendar_id||old.calendar_id;old.working_days=d.project.calendar.working_days||old.working_days;old.exceptions=d.project.calendar.exceptions||old.exceptions}old.revision=d.project.revision;old.transferLog=old.transferLog||[];old.transferLog.push({direction:'accept',counterparty:(d.sender&&d.sender.name)||'—',comment:d.comment||'',revision:old.revision,package_name:'',ts:d.createdAt});repairProject(old);calculateProject(old);await dbPutProject(old);window.__pkgData=null;closeModal();state.notice='Изменения приняты; прежняя версия в резервной копии.';render()}
async function returnReject(){const d=window.__pkgData;const old=state.projects.find(p=>p.id===d.project.projectId);if(old){old.transferLog=old.transferLog||[];old.transferLog.push({direction:'reject',counterparty:(d.sender&&d.sender.name)||'—',comment:d.comment||'',revision:old.revision||1,package_name:'',ts:d.createdAt});await dbPutProject(old)}window.__pkgData=null;closeModal();state.notice='Возврат отклонён.';render()}
/* ---- тесты ---- */
function assert(c,n,R){R.push({name:n,ok:!!c});return !!c}
function runTests(){const R=[];const P=createProjectObject('T','2026-11-02');
function mk(name,dur,o={}){const t={id:uid(),project_id:P.id,parent_id:o.parent||null,external_number:'',sort_order:P.tasks.length,level:0,name,duration_days:dur,start_date:null,finish_date:null,is_milestone:dur===0,is_manual:!!o.manual,percent_complete:0,owner:o.owner||'',status:'',note:'',collapsed:false,constraint_snet:o.snet||'',custom1:'',custom2:'',custom3:'',custom4:'',custom5:''};P.tasks.push(t);return t}
const a=mk('A',3),b=mk('B',2),c=mk('C',0),m=mk('M',5,{manual:true});m.start_date='2026-12-01';m.finish_date='2026-12-07';
P.dependencies.push({id:uid(),project_id:P.id,pred_id:a.id,succ_id:b.id,type:'FS',lag_workdays:2});
P.dependencies.push({id:uid(),project_id:P.id,pred_id:b.id,succ_id:c.id,type:'FS',lag_workdays:0});
repairProject(P);calculateProject(P);
assert(serialFor(P,'2026-11-02')!=null,'Календарь: рабочие дни',R);
assert(!isWorkdayISO(P,'2026-11-04'),'Календарь: праздник РФ 04.11',R);
assert(parseDuration('2н')===10,'Длительность 2н=10',R);
assert(serialFor(P,b.start_date)===serialFor(P,a.finish_date)+3,'CPM FS+2д',R);
assert(serialFor(P,c.start_date)===serialFor(P,b.finish_date)+1&&c.is_milestone,'CPM веха после B',R);
assert(m.start_date==='2026-12-01','Ручной режим не пересчитывается',R);
const g1=mk('G1',0),g2=mk('G2',1,{parent:g1.id}),g2b=mk('G2b',1,{parent:g1.id}),g3=mk('G3',1,{parent:g2.id});repairProject(P);calculateProject(P);
assert(flattenAll(P).find(r=>r.id===g3.id).level===2,'WBS уровень 3 существует',R);
applyStructuralMove(P,[g3.id],{beforeId:g2b.id,level:2});assert(flattenAll(P).find(r=>r.id===g3.id).level===2,'Перемещение: уровень 3 не перескакивает',R);
applyStructuralMove(P,[g3.id],{beforeId:g2b.id,level:5});assert(flattenAll(P).find(r=>r.id===g3.id).level===2,'Попытка прыжка на уровень 6 клампится',R);
P.dependencies.push({id:uid(),project_id:P.id,pred_id:c.id,succ_id:a.id,type:'FS',lag_workdays:0});calculateProject(P);assert(!!P.cpmError||findCyclePath(P),'Цикл обнаруживается',R);P.dependencies=P.dependencies.filter(d=>!(d.pred_id===c.id&&d.succ_id===a.id));calculateProject(P);
const sum=mk('S',0);mk('S1',2,{parent:sum.id});repairProject(P);calculateProject(P);assert(P.tasks.find(t=>t.id===sum.id).duration_days>0,'Суммарная агрегируется',R);
const sumT=P.tasks.find(t=>t.id===sum.id);sumT.is_manual=true;sumT.start_date='2026-11-02';sumT.finish_date='2026-11-20';calculateProject(P);assert(P.tasks.find(t=>t.id===sum.id).finish_date==='2026-11-20','Суммарная с ручными датами сохраняется',R);
const t1=mk('X1',1),t2=mk('X2',1,{owner:'Тестовый'});repairProject(P);calculateProject(P);
addOwnerToDict('Тестовый',true);assert(state.owners.includes('Тестовый'),'Справочник ответственных пополняется',R);
assert(setPredecessors(P,t2.id,'1НС').length===0,'Синтаксис НС разбирается',R);
assert(setPredecessors(P,t2.id,'99НС').length===1,'Несуществующий номер → предупреждение',R);
assert(parseTable('№\tЗадача\tДлительность\n1\tТ1\t2д\n2\tТ2\t1д').length===3,'TSV разбирается',R);
assert(makeXlsx([{name:'S',rows:[['a',1],['<x>&',2]]}]).size>500,'XLSX zip формируется',R);
assert(serializeWorkspace().schemaVersion===SCHEMA_VERSION,'Схема версиируется',R);
let migErr=null;try{migrateData({format:'localpm',projects:[],schemaVersion:99})}catch(e){migErr=e}assert(!!migErr,'Файл новой схемы отклоняется',R);
const h0=history.undo.length;pushHistory();assert(history.undo.length===h0+1,'Undo снапшот',R);
logChange(P,t1.id,'test','проверка');assert((P.changeLog||[]).length>0,'Журнал изменений пишется',R);
assert(typeof sha256==='function','SHA-256 доступен',R);
assert(Array.isArray(validatePlan(P)),'Валидатор работает',R);
assert(typeof ICONS.save==='string'&&ic('save').includes('<svg'),'SVG-иконки формируются',R);
const ok=R.filter(r=>r.ok).length;
showModal(`Самотестирование: ${ok}/${R.length}`,`<div class="form-field full"><div style="max-height:340px;overflow:auto">${R.map(r=>`<div>${r.ok?'✅':'❌'} ${esc(r.name)}</div>`).join('')}</div></div>`,`<button class="btn" onclick="App.printProtocol()">Печать протокола (PDF)</button><button class="btn primary" onclick="App.closeModal()">Закрыть</button>`);window.__testReport=R}
function printProtocol(){const R=window.__testReport||[];const ok=R.filter(r=>r.ok).length;el('print-area').innerHTML=`<h1>Протокол испытаний LocalPM v1.1</h1><div>Дата: ${new Date().toLocaleString('ru-RU')} · Стиль: ${state.uiStyle} · Пройдено: ${ok}/${R.length}</div><table><tr><th>№</th><th>Проверка</th><th>Результат</th></tr>${R.map((r,i)=>`<tr><td>${i+1}</td><td>${esc(r.name)}</td><td>${r.ok?'ПРОЙДЕНО':'ОТКАЗ'}</td></tr>`).join('')}</table><div>Подготовлено в LocalPM. Печать → Сохранить как PDF.</div>`;setTimeout(()=>window.print(),150)}

const App={state,goProjects,openProject,deleteProject,archiveProject,unarchive,copyProject,toggleArchive,showNewProjectModal,saveNewProject,showProjectSettings,saveProjectSettings,toggleCollapse,collapseAll,expandTo,addTask,addSubtask,createGroup,deleteTask,moveTask,indentTask,outdentTask,openTaskCard,saveTaskCard,setAuto:()=>setScheduling(false),setManual:()=>setScheduling(true),copySel:copySelection,pasteSel:pasteClipboard,undo,redo,showImportWizard,importPreview,importApply,exportExcel,exportPNG,showPrint,setScale,setViewFlag,searchNext,setSearch,setGroupBy,showFilters,applyFilters,resetFilters,saveBaseline,showProblems,autoFit:()=>autoFitColumns(null),saveNow,showDbModal,showDbSetupModal,showAppearance,saveAppearance,resolveConflict,backup:createBackup,wsExport,wsImport,wsImportApply,dbLink:linkViaFS,dbCreateFs:createViaFS,dbOpenInput:openFileViaInput,dbRefresh:refreshFromFile,dbSave:saveToFileNow,dbRecheck,dbTemplate,dbCreate,dbPick,dbLocal,transferOut,transferBuild,transferImport,showTransferIn,returnAccept,returnReject,runTests,printProtocol,toggleTheme,closeModal,ghostAdd};
function setScale(v){state.scale=v;const p=currentProject();if(p){p.view_settings=p.view_settings||{};p.view_settings.scale=v;saveCurrentProject()}render()}
document.addEventListener('DOMContentLoaded',async()=>{initCalendar();loadOwners();await initStorage();await requestPersistentStorage();try{state.fileHandle=(await idbGetMeta('fileHandle'))||null}catch(e){}applyTheme();initInteractions();await initWorkspace();render();if(state.conflict)showConflictModal();else if(state.dbMissing&&!sessionStorage.getItem('localpm_db_skip'))showDbSetupModal();

window.addEventListener('beforeunload',e=>{if(state.fileDirty&&state.dbMode!=='file'){e.preventDefault();e.returnValue=''}})});
